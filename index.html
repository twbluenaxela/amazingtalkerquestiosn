<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>倉頡練習 Cangjie Practice</title>
  <style>
    /* ── Reset & Base ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f3ef;
      --card: #ffffff;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --success: #22c55e;
      --error: #ef4444;
      --warn: #f59e0b;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --key-bg: #f1f5f9;
      --key-active: #bfdbfe;
      --key-correct: #bbf7d0;
      --radius: 12px;
      --shadow: 0 2px 12px rgba(0,0,0,.08);
    }
    html { font-size: 16px; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang TC',
                   'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    /* ── Header ── */
    header {
      background: var(--primary);
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: .5px; }
    .score-bar {
      display: flex;
      gap: 12px;
      font-size: .85rem;
      font-weight: 600;
    }
    .score-bar span { background: rgba(255,255,255,.2); padding: 3px 10px; border-radius: 20px; }
    .score-correct { color: #bbf7d0; }
    .score-total   { color: #fff; }

    /* ── Category Tabs ── */
    .tabs {
      display: flex;
      overflow-x: auto;
      gap: 6px;
      padding: 12px 16px 0;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--card);
      cursor: pointer;
      font-size: .8rem;
      font-weight: 600;
      color: var(--muted);
      transition: all .2s;
      white-space: nowrap;
    }
    .tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    /* ── Main Card ── */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      gap: 16px;
      max-width: 640px;
      width: 100%;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      width: 100%;
    }

    /* Character display */
    .char-display {
      text-align: center;
      padding: 8px 0 4px;
    }
    .char-big {
      font-size: 5rem;
      line-height: 1;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -2px;
    }
    .char-meta {
      margin-top: 8px;
      font-size: .85rem;
      color: var(--muted);
    }
    .char-pinyin { font-style: italic; margin-right: 8px; }
    .char-meaning { font-weight: 600; }

    /* Progress */
    .progress-wrap {
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: .78rem;
      color: var(--muted);
    }
    .progress-bar {
      flex: 1;
      height: 5px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
      transition: width .4s;
    }

    /* Input area */
    .input-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 4px 0;
    }
    .code-display {
      display: flex;
      gap: 8px;
      justify-content: center;
      min-height: 52px;
      align-items: center;
    }
    .code-key {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      background: var(--key-bg);
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: .85rem;
      font-weight: 700;
      text-transform: uppercase;
      transition: all .15s;
      position: relative;
    }
    .code-key .radical {
      font-size: .6rem;
      color: var(--muted);
      font-weight: 400;
      margin-top: 1px;
    }
    .code-key.typed   { background: var(--key-active); border-color: var(--primary); color: var(--primary-dark); }
    .code-key.correct { background: var(--key-correct); border-color: var(--success); color: #15803d; }
    .code-key.wrong   { background: #fee2e2; border-color: var(--error); color: #b91c1c; }
    .code-key.empty   { border-style: dashed; opacity: .4; }

    /* Hidden real input to catch keyboard */
    #hidden-input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      width: 1px;
      height: 1px;
    }

    /* Feedback message */
    .feedback {
      font-size: .95rem;
      font-weight: 700;
      min-height: 1.4em;
      text-align: center;
      transition: opacity .2s;
    }
    .feedback.correct { color: var(--success); }
    .feedback.wrong   { color: var(--error); }
    .feedback.hint    { color: var(--warn); }

    /* Answer reveal */
    .answer-reveal {
      font-size: .85rem;
      color: var(--muted);
      text-align: center;
      min-height: 1.2em;
    }
    .answer-reveal strong { color: var(--text); font-family: monospace; letter-spacing: 2px; font-size: 1rem; }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    button {
      padding: 10px 22px;
      border-radius: 8px;
      border: none;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-secondary {
      background: var(--key-bg);
      color: var(--text);
      border: 1.5px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); }
    .btn-skip {
      background: transparent;
      color: var(--muted);
      font-size: .8rem;
      padding: 6px 14px;
    }

    /* ── Cangjie Keyboard Reference ── */
    .kbd-ref {
      width: 100%;
    }
    .kbd-ref h3 {
      font-size: .8rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: center;
    }
    .kbd-row {
      display: flex;
      gap: 4px;
    }
    .kkey {
      width: 32px;
      height: 36px;
      border-radius: 5px;
      background: var(--key-bg);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: .65rem;
      line-height: 1.1;
      cursor: pointer;
      transition: background .1s;
      user-select: none;
    }
    .kkey:active { background: var(--key-active); }
    .kkey .eng  { font-weight: 700; font-size: .7rem; }
    .kkey .chi  { font-size: .62rem; color: var(--muted); }
    .kkey.lit   { background: var(--key-active); border-color: var(--primary); }

    /* ── Stats / Completed ── */
    .done-screen {
      text-align: center;
      padding: 16px 0;
    }
    .done-screen .big-emoji { font-size: 3.5rem; margin-bottom: 8px; }
    .done-screen h2 { font-size: 1.3rem; margin-bottom: 6px; }
    .done-screen p  { color: var(--muted); font-size: .9rem; }
    .stat-row {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 16px 0;
      flex-wrap: wrap;
    }
    .stat-box {
      padding: 12px 20px;
      border-radius: var(--radius);
      background: var(--key-bg);
      text-align: center;
    }
    .stat-box .num  { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
    .stat-box .lbl  { font-size: .75rem; color: var(--muted); margin-top: 2px; }

    /* ── Mobile tap buttons (virtual keyboard) ── */
    .mobile-hint {
      font-size: .75rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 4px;
    }

    @media (max-width: 480px) {
      .char-big { font-size: 4rem; }
      .kkey { width: 28px; height: 32px; font-size: .55rem; }
      .kkey .eng { font-size: .6rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>倉頡練習 ⌨️</h1>
  <div class="score-bar">
    <span class="score-correct">✓ <span id="hdr-correct">0</span></span>
    <span class="score-total">題 <span id="hdr-total">0</span></span>
  </div>
</header>

<div class="tabs" id="tabs"></div>

<main>
  <!-- Practice card -->
  <div class="card" id="practice-card">
    <div class="char-display">
      <div class="char-big" id="char-display">？</div>
      <div class="char-meta">
        <span class="char-pinyin" id="char-pinyin"></span>
        <span class="char-meaning" id="char-meaning"></span>
      </div>
      <div class="progress-wrap">
        <span id="prog-text">0 / 0</span>
        <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0%"></div></div>
      </div>
    </div>

    <hr style="margin:16px 0;border:none;border-top:1px solid var(--border)">

    <div class="input-area">
      <div class="mobile-hint">用鍵盤打倉頡碼，或點下方字母鍵</div>

      <div class="code-display" id="code-display"></div>

      <input id="hidden-input" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" />

      <div class="feedback" id="feedback"></div>
      <div class="answer-reveal" id="answer-reveal"></div>

      <div class="btn-row">
        <button class="btn-secondary" id="btn-hint">提示</button>
        <button class="btn-primary" id="btn-next" style="display:none">下一題 →</button>
        <button class="btn-skip" id="btn-skip">跳過</button>
      </div>
    </div>
  </div>

  <!-- Done screen (hidden) -->
  <div class="card done-screen" id="done-card" style="display:none">
    <div class="big-emoji" id="done-emoji">🎉</div>
    <h2 id="done-title">練習完成！</h2>
    <p id="done-sub"></p>
    <div class="stat-row">
      <div class="stat-box">
        <div class="num" id="stat-correct">-</div>
        <div class="lbl">答對</div>
      </div>
      <div class="stat-box">
        <div class="num" id="stat-total">-</div>
        <div class="lbl">總題數</div>
      </div>
      <div class="stat-box">
        <div class="num" id="stat-pct">-</div>
        <div class="lbl">正確率</div>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btn-restart">再練一次</button>
      <button class="btn-secondary" id="btn-allcat">選其他類別</button>
    </div>
  </div>

  <!-- Cangjie keyboard reference -->
  <div class="card kbd-ref">
    <h3>倉頡字母對照</h3>
    <div class="keyboard" id="keyboard"></div>
  </div>
</main>

  // ── 人際關係
  { char:'朋', code:'bb',    pinyin:'péng', meaning:'朋/Friend',  cat:'people' },
  { char:'友', code:'ke',    pinyin:'yǒu',  meaning:'友/Friend',  cat:'people' },

  { char:'兄', code:'rhu',   pinyin:'xiōng',meaning:'兄/Brother', cat:'people' },
  { char:'弟', code:'cnlh',  pinyin:'dì',   meaning:'弟/Brother', cat:'people' },
  { char:'姐', code:'vbm',   pinyin:'jiě',  meaning:'姐/Sister',  cat:'people' },
  { char:'妹', code:'vjd',   pinyin:'mèi',  meaning:'妹/Sister',  cat:'people' },
  { char:'男', code:'wks',   pinyin:'nán',  meaning:'男/Male',    cat:'people' },
  { char:'女', code:'v',     pinyin:'nǚ',   meaning:'女/Female',  cat:'people' },
  { char:'老', code:'jkp',   pinyin:'lǎo',  meaning:'老/Old',     cat:'people' },
  { char:'師', code:'hrmlb', pinyin:'shī',  meaning:'師/Teacher', cat:'people' },

  // ── 道謝道歉
  { char:'謝', code:'yrhhi', pinyin:'xiè',  meaning:'謝/Thanks',  cat:'polite' },
  { char:'對', code:'tgdi',  pinyin:'duì',  meaning:'對/Correct', cat:'polite' },
  { char:'起', code:'goru',  pinyin:'qǐ',   meaning:'起/Rise',    cat:'polite' },
  { char:'沒', code:'ehse',  altCodes:['ene'], pinyin:'méi',  meaning:'沒/No/Not',  cat:'polite' },
  { char:'事', code:'jlln',  pinyin:'shì',  meaning:'事/Matter',  cat:'polite' },

  // ── 網路用語 / 常用表達
  { char:'哈', code:'romr',  pinyin:'hā',   meaning:'哈/LOL',     cat:'net' },
  { char:'哦', code:'rhqi',  pinyin:'ò',    meaning:'哦/Oh I see',cat:'net' },
  { char:'嗯', code:'rwkp',  pinyin:'ń',    meaning:'嗯/Mm',      cat:'net' },
  { char:'喔', code:'rsmg',  pinyin:'ō',    meaning:'喔/Oh',      cat:'net' },
  { char:'棒', code:'dqkq',  pinyin:'bàng', meaning:'棒/Awesome', cat:'net' },
  { char:'讚', code:'yrhuc', pinyin:'zàn',  meaning:'讚/Like',    cat:'net' },
  { char:'很', code:'hoav',  pinyin:'hěn',  meaning:'很/Very',    cat:'net' },
  { char:'超', code:'goshr', pinyin:'chāo', meaning:'超/Super',   cat:'net' },
  { char:'最', code:'asje',  pinyin:'zuì',  meaning:'最/Most',    cat:'net' },
  { char:'好', code:'vnd',   pinyin:'hǎo',  meaning:'好/Good',    cat:'net' },
  { char:'了', code:'nn',    pinyin:'le',   meaning:'了/Done',    cat:'net' },
  { char:'喜', code:'grtr',  pinyin:'xǐ',   meaning:'喜/Like',    cat:'net' },
  { char:'歡', code:'tgno',  pinyin:'huān', meaning:'歡/Happy',   cat:'net' },
  { char:'哭', code:'rrik',  pinyin:'kū',   meaning:'哭/Cry',     cat:'net' },
];

// Remove duplicates by char
const seen = new Set();
const UNIQUE_CHARS = CHARS.filter(c => {
  if (seen.has(c.char)) return false;
  seen.add(c.char);
  return true;
});

// ─────────────────────────────────────────────
// Categories
// ─────────────────────────────────────────────
const CATEGORIES = [
  { id: 'all',      label: '全部' },
  { id: 'common',   label: '高頻字' },
  { id: 'greet',    label: '問候語' },
  { id: 'verbs',    label: '動詞' },
  { id: 'emotion',  label: '情感' },
  { id: 'time',     label: '時間' },
  { id: 'pronouns', label: '代詞' },
  { id: 'people',   label: '人際' },
  { id: 'polite',   label: '禮貌' },
  { id: 'net',      label: '網路用語' },
];

// ─────────────────────────────────────────────
// State
// ─────────────────────────────────────────────
let currentCat  = 'all';
let queue       = [];
let idx         = 0;
let typed       = '';
let answered    = false;
let totalQ      = 0;
let correctQ    = 0;
let litKeys     = new Set();

// ─────────────────────────────────────────────
// DOM refs
// ─────────────────────────────────────────────
const elChar    = document.getElementById('char-display');
const elPinyin  = document.getElementById('char-pinyin');
const elMeaning = document.getElementById('char-meaning');
const elProg    = document.getElementById('prog-text');
const elFill    = document.getElementById('prog-fill');
const elCode    = document.getElementById('code-display');
const elFB      = document.getElementById('feedback');
const elReveal  = document.getElementById('answer-reveal');
const elNext    = document.getElementById('btn-next');
const elHint    = document.getElementById('btn-hint');
const elSkip    = document.getElementById('btn-skip');
const elInput   = document.getElementById('hidden-input');
const elHdrC    = document.getElementById('hdr-correct');
const elHdrT    = document.getElementById('hdr-total');
const elPCard   = document.getElementById('practice-card');
const elDCard   = document.getElementById('done-card');
const elKbd     = document.getElementById('keyboard');

// ─────────────────────────────────────────────
// Build Cangjie keyboard reference
// ─────────────────────────────────────────────
const KBD_ROWS = [
  ['q','w','e','r','t','y','u','i','o','p'],
  ['a','s','d','f','g','h','j','k','l'],
  ['z','x','c','v','b','n','m'],
];

function buildKeyboard() {
  KBD_ROWS.forEach(row => {
    const div = document.createElement('div');
    div.className = 'kbd-row';
    row.forEach(k => {
      const el = document.createElement('div');
      el.className = 'kkey';
      el.id = `kkey-${k}`;
      el.innerHTML = `<span class="eng">${k.toUpperCase()}</span><span class="chi">${CJ_KEYS[k] || ''}</span>`;
      div.appendChild(el);
    });
    elKbd.appendChild(div);
  });
}

function litKeyboard(keys) {
  litKeys.forEach(k => {
    const el = document.getElementById(`kkey-${k}`);
    if (el) el.classList.remove('lit');
  });
  litKeys.clear();
  keys.forEach(k => {
    const el = document.getElementById(`kkey-${k}`);
    if (el) { el.classList.add('lit'); litKeys.add(k); }
  });
}

// ─────────────────────────────────────────────
// Build category tabs
// ─────────────────────────────────────────────
function buildTabs() {
  const wrap = document.getElementById('tabs');
  CATEGORIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab' + (c.id === currentCat ? ' active' : '');
    const count = c.id === 'all'
      ? UNIQUE_CHARS.length
      : UNIQUE_CHARS.filter(x => x.cat === c.id).length;
    btn.textContent = `${c.label} (${count})`;
    btn.dataset.cat = c.id;
    btn.addEventListener('click', () => {
      currentCat = c.id;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      startSession();
    });
    wrap.appendChild(btn);
  });
}

// ─────────────────────────────────────────────
// Session management
// ─────────────────────────────────────────────
function startSession() {
  const pool = currentCat === 'all'
    ? [...UNIQUE_CHARS]
    : UNIQUE_CHARS.filter(c => c.cat === currentCat);

  // Shuffle
  queue = pool.sort(() => Math.random() - .5);
  idx       = 0;
  totalQ    = 0;
  correctQ  = 0;
  updateHeader();
  elPCard.style.display = '';
  elDCard.style.display = 'none';
  loadQuestion();
}

function loadQuestion() {
  if (idx >= queue.length) { showDone(); return; }
  const item = queue[idx];
  elChar.textContent    = item.char;
  elPinyin.textContent  = item.pinyin;
  elMeaning.textContent = item.meaning;
  typed    = '';
  answered = false;
  elFB.textContent     = '';
  elFB.className       = 'feedback';
  elReveal.innerHTML   = '';
  elNext.style.display = 'none';
  elHint.style.display = '';
  elSkip.style.display = '';
  renderCodeSlots(item.code, '');
  litKeyboard([]);
  updateProgress();
  focusInput();
}

function updateProgress() {
  const total = queue.length;
  const pct   = total ? Math.round((idx / total) * 100) : 0;
  elProg.textContent      = `${idx} / ${total}`;
  elFill.style.width      = `${pct}%`;
}

function updateHeader() {
  elHdrC.textContent = correctQ;
  elHdrT.textContent = totalQ;
}

// ─────────────────────────────────────────────
// Render code key slots
// ─────────────────────────────────────────────
function renderCodeSlots(code, typed, state) {
  elCode.innerHTML = '';
  const len = code.length;
  for (let i = 0; i < len; i++) {
    const letter = code[i];
    const div = document.createElement('div');
    let cls = 'code-key';
    if (state === 'correct') {
      cls += ' correct';
      div.innerHTML = `${letter.toUpperCase()}<span class="radical">${CJ_KEYS[letter] || ''}</span>`;
    } else if (state === 'wrong') {
      if (i < typed.length) {
        cls += typed[i] === letter ? ' correct' : ' wrong';
      } else {
        cls += ' empty';
      }
      div.innerHTML = `${letter.toUpperCase()}<span class="radical">${CJ_KEYS[letter] || ''}</span>`;
    } else {
      if (i < typed.length) {
        cls += ' typed';
        div.innerHTML = `${typed[i].toUpperCase()}<span class="radical">${CJ_KEYS[typed[i]] || ''}</span>`;
      } else {
        cls += ' empty';
        div.innerHTML = `<span style="opacity:.3">-</span>`;
      }
    }
    div.className = cls;
    elCode.appendChild(div);
  }
}

// ─────────────────────────────────────────────
// Input handling
// ─────────────────────────────────────────────
function focusInput() {
  elInput.value = '';
  // Small timeout for mobile
  setTimeout(() => elInput.focus(), 50);
}

elInput.addEventListener('input', e => {
  if (answered) return;
  const raw  = e.target.value.toLowerCase().replace(/[^a-z]/g, '');
  e.target.value = '';
  if (!raw) return;
  const item = queue[idx];
  const code = item.code;

  // Accept one char at a time
  for (const ch of raw) {
    if (typed.length < code.length) {
      typed += ch;
    }
  }
  renderCodeSlots(code, typed, null);
  litKeyboard([...typed]);

  // Auto-submit when length matches
  if (typed.length === code.length) {
    submitAnswer();
  }
});

// Also handle keydown for better desktop UX
elInput.addEventListener('keydown', e => {
  if (e.key === 'Backspace' && !answered) {
    typed = typed.slice(0, -1);
    renderCodeSlots(queue[idx].code, typed, null);
    litKeyboard([...typed]);
    e.preventDefault();
    return;
  }
  if (e.key === 'Enter' && answered) {
    nextQuestion();
    return;
  }
});

// Click anywhere on practice card to refocus
elPCard.addEventListener('click', () => { if (!answered) focusInput(); });

// ─────────────────────────────────────────────
// Submit
// ─────────────────────────────────────────────
function submitAnswer() {
  if (answered) return;
  answered = true;
  const item      = queue[idx];
  const code      = item.code;
  const validCodes = [code, ...(item.altCodes || [])];
  const isOK      = validCodes.includes(typed);

  totalQ++;
  if (isOK) correctQ++;
  updateHeader();

  if (isOK) {
    elFB.textContent  = '✓ 正確！';
    elFB.className    = 'feedback correct';
    renderCodeSlots(code, typed, 'correct');
    litKeyboard([...code]);
  } else {
    elFB.textContent  = '✗ 不對，正確答案：';
    elFB.className    = 'feedback wrong';
    renderCodeSlots(code, typed, 'wrong');
    showReveal(code);
  }

  elNext.style.display = 'inline-block';
  elHint.style.display = 'none';
  elSkip.style.display = 'none';
}

function showReveal(code) {
  const keys = [...code].map(k => `<strong>${k.toUpperCase()}</strong> ${CJ_KEYS[k] || ''}`).join(' ');
  elReveal.innerHTML = `${code.toUpperCase()} （${[...code].map(k=>CJ_KEYS[k]||k).join('')}）`;
}

// ─────────────────────────────────────────────
// Next question
// ─────────────────────────────────────────────
function nextQuestion() {
  idx++;
  loadQuestion();
}

elNext.addEventListener('click', nextQuestion);

elSkip.addEventListener('click', () => {
  // Move skipped item to end
  const skipped = queue.splice(idx, 1)[0];
  queue.push(skipped);
  updateProgress();
  loadQuestion();
});

elHint.addEventListener('click', () => {
  const item  = queue[idx];
  const first = item.code[0];
  elFB.textContent = `提示：第一個字母是 ${first.toUpperCase()} (${CJ_KEYS[first] || first})`;
  elFB.className   = 'feedback hint';
  litKeyboard([first]);
  focusInput();
});

// ─────────────────────────────────────────────
// Done screen
// ─────────────────────────────────────────────
function showDone() {
  elPCard.style.display = 'none';
  elDCard.style.display = '';
  const pct = totalQ ? Math.round((correctQ / totalQ) * 100) : 0;
  document.getElementById('stat-correct').textContent = correctQ;
  document.getElementById('stat-total').textContent   = totalQ;
  document.getElementById('stat-pct').textContent     = pct + '%';
  document.getElementById('done-emoji').textContent   = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '📚';
  document.getElementById('done-title').textContent   = pct >= 80 ? '練習完成！太棒了！' : pct >= 50 ? '繼續努力！' : '加油！多練習！';
  document.getElementById('done-sub').textContent     = `本次正確率 ${pct}%`;
  litKeyboard([]);
}

document.getElementById('btn-restart').addEventListener('click', startSession);
document.getElementById('btn-allcat').addEventListener('click', () => {
  currentCat = 'all';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab[data-cat="all"]').classList.add('active');
  startSession();
});

// ─────────────────────────────────────────────
// Init
// ─────────────────────────────────────────────
buildKeyboard();

// Tap keyboard keys on mobile (delegated)
elKbd.addEventListener('click', e => {
  if (answered) return;
  const el = e.target.closest('.kkey');
  if (!el) return;
  const key = el.id.replace('kkey-', '');
  const item = queue[idx];
  if (!item) return;
  const code = item.code;
  if (typed.length < code.length) {
    typed += key;
    renderCodeSlots(code, typed, null);
    litKeyboard([...typed]);
    if (typed.length === code.length) submitAnswer();
  }
});

buildTabs();
startSession();
</script>
